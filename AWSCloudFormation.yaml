AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cowrie SSH honeypot: VPC, public subnet, internet gateway, S3 gateway endpoint,
  security group, IAM role, and EC2 instance. Generated with the CloudFormation
  IaC generator and cleaned up for fresh deployment.

Parameters:
  AdminCidr1:
    Type: String
    Description: First admin IP allowed to reach port 5555 (e.g. 1.2.3.4/32)
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  InstanceConnectPrefixListId:
    Type: String
    Description: AWS-managed EC2 Instance Connect prefix list for this region
    Default: pl-0e4bcff02b13bef1e
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: AMI for the honeypot instance (must include /opt/upload_cowrie.py)
    Default: ami-0b6d9d3d33ba97d99
  InstanceType:
    Type: String
    Default: t3.small
  LogBucketName:
    Type: String
    Description: Existing S3 bucket that receives Cowrie logs
    Default: haas-cowrie-logs-group-2026
  LogTableName:
    Type: String
    Description: Existing DynamoDB table read by the dashboard
    Default: CowrieLogs
  KnowledgeBaseId:
    Type: String
    Description: Existing Bedrock knowledge base ID
    Default: 8OEJS30MCD

Resources:
  # ---------- Networking ----------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: Honeypot-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Honeypot-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/20
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Honeypot-subnet-public1

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Honeypot-rtb-public

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PublicRouteTable
      Tags:
        - Key: Name
          Value: Honeypot-vpce-s3

  # ---------- Security ----------
  HoneypotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: Honeypot-Cowrie-SG
      GroupDescription: Controls network access to the Cowrie honeypot
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: Cowrie SSH honeypot (open to the internet on purpose)
          IpProtocol: tcp
          FromPort: 2222
          ToPort: 2222
          CidrIp: 0.0.0.0/0
        - Description: Real SSH via EC2 Instance Connect
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourcePrefixListId: !Ref InstanceConnectPrefixListId
        - Description: Port 5555 via EC2 Instance Connect
          IpProtocol: tcp
          FromPort: 5555
          ToPort: 5555
          SourcePrefixListId: !Ref InstanceConnectPrefixListId
        - Description: Port 5555 from admin IP 1
          IpProtocol: tcp
          FromPort: 5555
          ToPort: 5555
          CidrIp: !Ref AdminCidr1
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Honeypot-Cowrie-SG

  HoneypotEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Honeypot-EC2-Role
      Description: Allows the honeypot EC2 instance to use Session Manager, CloudWatch, S3 logs, DynamoDB, and Bedrock.
      Path: /
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CowrieDashboardDynamoDBRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${LogTableName}
        - PolicyName: CowrieLogBucketUploadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ViewCowrieLogBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::${LogBucketName}
              - Sid: UploadCowrieLogs
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub arn:aws:s3:::${LogBucketName}/*
        - PolicyName: EC2Bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:Retrieve
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-micro-v1:0

  HoneypotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: Honeypot-EC2-Role
      Path: /
      Roles:
        - !Ref HoneypotEC2Role

  # ---------- Compute ----------
  HoneypotInstance:
    Type: AWS::EC2::Instance
    DependsOn: InternetRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref HoneypotSecurityGroup
      IamInstanceProfile: !Ref HoneypotInstanceProfile
      EbsOptimized: true
      Monitoring: false
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 16
            Iops: 3000
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          python3 /opt/upload_cowrie.py
      Tags:
        - Key: Name
          Value: Honeypot-Cowrie-Server

Outputs:
  InstanceId:
    Value: !Ref HoneypotInstance
  PublicIp:
    Description: Point attackers (and your tests) here on port 2222
    Value: !GetAtt HoneypotInstance.PublicIp
  VpcId:
    Value: !Ref VPC
